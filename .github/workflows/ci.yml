name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --version
      - run: shellcheck -s bash keepwarm tests/run.sh
      - name: PowerShell sources must be ASCII after any BOM
        # Windows PowerShell 5.1 decodes a BOM-less .ps1 as ANSI (CP1252),
        # where an em-dash's trailing byte becomes a smart double-quote and
        # desyncs the parser. Both the BOM and ASCII-only guard against that;
        # this check keeps the second one honest.
        run: |
          python3 - <<'EOF'
          import sys
          bad = False
          for f in ("keepwarm.ps1", "tests/run.ps1"):
              data = open(f, "rb").read()
              if data.startswith(b"\xef\xbb\xbf"):
                  data = data[3:]
              for i, b in enumerate(data):
                  if b > 127:
                      print(f"::error file={f}::non-ASCII byte 0x{b:02x} at offset {i}")
                      bad = True
                      break
          sys.exit(1 if bad else 0)
          EOF

  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu exercises the GNU date path, macos the BSD one.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Show environment
        run: |
          bash --version | head -1
          date --version 2>/dev/null | head -1 || echo "BSD date"
      - name: Run tests
        run: ./tests/run.sh

  bash32:
    name: bash 3.2 (macOS system bash)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm we are really on bash 3.2
        run: /bin/bash -c 'echo "$BASH_VERSION"'
      - name: Run tests under /bin/bash
        # `env bash` on a runner can pick up a newer Homebrew bash, so invoke
        # the 3.2 system bash explicitly — that is what most macOS users have.
        run: /bin/bash ./tests/run.sh

  # Two explicit jobs rather than a matrix: the `matrix` context is not
  # available in a step's `shell:` key, so `shell: ${{ matrix.shell }}` is a
  # workflow syntax error. Duplicating six lines is cheaper than the workaround.
  windows-ps51:
    name: tests (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show environment
        shell: powershell
        run: $PSVersionTable
      - name: Run tests
        shell: powershell
        run: .\tests\run.ps1

  windows-ps7:
    name: tests (PowerShell 7)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show environment
        shell: pwsh
        run: $PSVersionTable
      - name: Run tests
        shell: pwsh
        run: .\tests\run.ps1

  windows-lint:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PSScriptAnalyzer
        shell: powershell
        run: Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
      - name: Analyze
        shell: powershell
        run: |
          # -Path is [string], not [string[]] - passing both at once threw
          # "Cannot convert 'System.Object[]' to the type 'System.String'".
          $r = @('.\keepwarm.ps1', '.\tests\run.ps1') | ForEach-Object {
                 Invoke-ScriptAnalyzer -Path $_ -Severity Error,Warning }
          $r | Format-Table -AutoSize
          # Fail on errors; warnings are reported but not gating.
          if ($r | Where-Object { $_.Severity -eq 'Error' }) { exit 1 }

  windows-task-smoke:
    name: Task Scheduler install/uninstall
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Register, verify, unregister
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # install refuses to run without a resolvable claude binary, so give
          # it a stub — this step is about Task Scheduler, not about pinging.
          $stub = Join-Path $env:RUNNER_TEMP 'claude.cmd'
          '@echo off' | Set-Content $stub -Encoding ASCII
          $env:KEEPWARM_CLAUDE_BIN = $stub

          .\keepwarm.ps1 install
          $t = Get-ScheduledTask -TaskName 'claude-keepwarm' -ErrorAction SilentlyContinue
          if (-not $t) { throw 'task was not registered' }
          Write-Host "registered: $($t.TaskName) [$($t.State)]"

          .\keepwarm.ps1 uninstall
          if (Get-ScheduledTask -TaskName 'claude-keepwarm' -ErrorAction SilentlyContinue) {
            throw 'task was not removed'
          }
          Write-Host 'unregistered cleanly'

  timezones:
    name: half-hour timezone
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Kolkata is UTC+5:30 and Kathmandu UTC+5:45 — these break any
        # implementation that floors to the hour with epoch modulo 3600.
        tz: [UTC, Asia/Kolkata, Asia/Kathmandu, America/New_York]
    steps:
      - uses: actions/checkout@v4
      - name: Run tests in ${{ matrix.tz }}
        env:
          TZ: ${{ matrix.tz }}
        run: ./tests/run.sh
