<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 312" width="900" height="312"
     role="img" aria-labelledby="t1 d1" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t1">Without keepwarm: a window only starts when you do</title>
  <desc id="d1">Timeline from 02:00 to 15:00. No usage window runs during seven idle hours. The first message at 09:00 opens a window from 09:00 to 14:00. Quota is exhausted by 10:00, leaving four hours blocked with no access.</desc>

  <!-- Light values live on presentation attributes so the figure still renders
       correctly if a viewer strips <style>. The style block only overrides for
       dark mode, where a CSS rule outranks a presentation attribute. -->
  <style>
    .ink   { fill: #0b0b0b; }
    .ink2  { fill: #52514e; }
    .ink3  { fill: #8a8985; }
    .surf  { fill: #fcfcfb; }
    .onwin { fill: #ffffff; }
    .rule  { stroke: #dcdbd6; }
    .idle  { fill: #f0efec; }
    .deny  { fill: #d03b3b; }
    .win   { fill: #256abf; }
    @media (prefers-color-scheme: dark) {
      .ink  { fill: #ffffff; }
      .ink2 { fill: #c3c2b7; }
      .ink3 { fill: #8f8e86; }
      .surf { fill: #1a1a19; }
      .rule { stroke: #4a4a46; }
      .idle { fill: #383835; }
      .deny { fill: #e66767; }
      .win  { fill: #3987e5; }
      .onwin { fill: #0b0b0b; }
    }
  </style>

  <defs>
    <!-- Texture on the blocked band: secondary encoding so the meaning never
         rests on hue alone (colour-vision deficiency, print, forced colours). -->
    <pattern id="deny" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#d03b3b" fill-opacity="0.20"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#d03b3b" stroke-width="3.2"/>
    </pattern>
  </defs>

  <rect class="surf" x="0" y="0" width="900" height="312" fill="#fcfcfb"/>

  <text class="ink" x="34" y="36" font-size="16" font-weight="700" fill="#0b0b0b">Without keepwarm</text>
  <text class="ink2" x="34" y="57" font-size="13" fill="#52514e">A window only starts when you do — so idle hours buy you nothing.</text>

  <!-- ============================ lane 1: windows ============================ -->
  <text class="ink3" x="34" y="98" font-size="11" font-weight="600" fill="#8a8985" letter-spacing="0.6">USAGE WINDOW</text>

  <rect class="idle" x="90" y="106" width="376" height="40" rx="4" fill="#f0efec"/>
  <text class="ink2" x="278" y="131" font-size="12.5" text-anchor="middle" fill="#52514e">none running</text>

  <rect class="win" x="470" y="106" width="266" height="40" rx="4" fill="#256abf"/>
  <text class="onwin" x="603" y="131" font-size="12.5" font-weight="600" text-anchor="middle" fill="#ffffff">window 09:00 – 14:00</text>

  <rect class="idle" x="740" y="106" width="106" height="40" rx="4" fill="#f0efec"/>
  <text class="ink2" x="793" y="131" font-size="12" text-anchor="middle" fill="#52514e">none</text>

  <!-- ============================ lane 2: access ============================= -->
  <text class="ink3" x="34" y="182" font-size="11" font-weight="600" fill="#8a8985" letter-spacing="0.6">YOUR ACCESS</text>

  <rect class="idle" x="90" y="190" width="376" height="40" rx="4" fill="#f0efec"/>
  <text class="ink2" x="278" y="215" font-size="12.5" text-anchor="middle" fill="#52514e">away</text>

  <rect class="win" x="470" y="190" width="50" height="40" rx="4" fill="#256abf"/>
  <text class="onwin" x="495" y="215" font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff">1 h</text>

  <rect x="524" y="190" width="212" height="40" rx="4" fill="url(#deny)"/>
  <rect x="524" y="190" width="212" height="40" rx="4" fill="none" stroke="#d03b3b" stroke-width="1.5"/>
  <rect class="surf" x="572" y="200" width="116" height="21" rx="4" fill="#fcfcfb"/>
  <text class="deny" x="630" y="215" font-size="12.5" font-weight="700" text-anchor="middle" fill="#d03b3b">blocked · 4 h</text>

  <rect class="idle" x="740" y="190" width="106" height="40" rx="4" fill="#f0efec"/>

  <!-- ============================== markers ================================= -->
  <g stroke-linecap="round">
    <line class="rule" x1="470" y1="150" x2="470" y2="186" stroke="#dcdbd6" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line class="rule" x1="524" y1="150" x2="524" y2="186" stroke="#dcdbd6" stroke-width="1.5" stroke-dasharray="3 3"/>
  </g>
  <polygon points="470,96 465,88 475,88" class="ink" fill="#0b0b0b"/>
  <text class="ink" x="470" y="82" font-size="11.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">first message</text>

  <!-- ============================== time axis =============================== -->
  <line class="rule" x1="90" y1="248" x2="846" y2="248" stroke="#dcdbd6" stroke-width="1"/>
  <g class="ink3" font-size="11" text-anchor="middle" fill="#8a8985">
    <text x="90"  y="266">02:00</text>
    <text x="252" y="266">05:00</text>
    <text x="470" y="266">09:00</text>
    <text x="524" y="266">10:00</text>
    <text x="736" y="266">14:00</text>
  </g>

  <!-- ============================== takeaway ================================ -->
  <text class="ink2" x="90" y="290" font-size="12.5" fill="#52514e">
    <tspan font-weight="700">7 idle hours, then 4 more blocked.</tspan> The clock never ran while you were away.
  </text>
</svg>
