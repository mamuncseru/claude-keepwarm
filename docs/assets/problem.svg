<svg xmlns="http://www.w3.org/2000/svg" width="900" height="312" aria-labelledby="t1 d1" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" viewBox="0 0 900 312"><title id="t1">Without keepwarm: a window only starts when you do</title><desc id="d1">Timeline from 02:00 to 15:00. No usage window runs during seven idle hours. The first message at 09:00 opens a window from 09:00 to 14:00. Quota is exhausted by 10:00, leaving four hours blocked with no access.</desc><style>.ink{fill:#0b0b0b}.ink2{fill:#52514e}.ink3{fill:#8a8985}.surf{fill:#fcfcfb}.onwin{fill:#fff}.rule{stroke:#dcdbd6}.idle{fill:#f0efec}.deny{fill:#d03b3b}.win{fill:#256abf}@media (prefers-color-scheme:dark){.ink{fill:#fff}.ink2{fill:#c3c2b7}.ink3{fill:#8f8e86}.surf{fill:#1a1a19}.rule{stroke:#4a4a46}.idle{fill:#383835}.deny{fill:#e66767}.win{fill:#3987e5}.onwin{fill:#0b0b0b}}</style><defs><pattern id="deny" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#d03b3b" fill-opacity=".2"/><line x1="0" x2="0" y1="0" y2="8" stroke="#d03b3b" stroke-width="3.2"/></pattern></defs><rect width="900" height="312" x="0" y="0" fill="#fcfcfb" class="surf"/><text x="34" y="36" fill="#0b0b0b" class="ink" font-size="16" font-weight="700">Without keepwarm</text><text x="34" y="57" fill="#52514e" class="ink2" font-size="13">A window only starts when you do — so idle hours buy you nothing.</text><text x="34" y="98" fill="#8a8985" class="ink3" font-size="11" font-weight="600" letter-spacing=".6">USAGE WINDOW</text><rect width="376" height="40" x="90" y="106" fill="#f0efec" class="idle" rx="4"/><text x="278" y="131" fill="#52514e" class="ink2" font-size="12.5" text-anchor="middle">none running</text><rect width="266" height="40" x="470" y="106" fill="#256abf" class="win" rx="4"/><text x="603" y="131" fill="#fff" class="onwin" font-size="12.5" font-weight="600" text-anchor="middle">window 09:00 – 14:00</text><rect width="106" height="40" x="740" y="106" fill="#f0efec" class="idle" rx="4"/><text x="793" y="131" fill="#52514e" class="ink2" font-size="12" text-anchor="middle">none</text><text x="34" y="182" fill="#8a8985" class="ink3" font-size="11" font-weight="600" letter-spacing=".6">YOUR ACCESS</text><rect width="376" height="40" x="90" y="190" fill="#f0efec" class="idle" rx="4"/><text x="278" y="215" fill="#52514e" class="ink2" font-size="12.5" text-anchor="middle">away</text><rect width="50" height="40" x="470" y="190" fill="#256abf" class="win" rx="4"/><text x="495" y="215" fill="#fff" class="onwin" font-size="12" font-weight="600" text-anchor="middle">1 h</text><rect width="212" height="40" x="524" y="190" fill="url(#deny)" rx="4"/><rect width="212" height="40" x="524" y="190" fill="none" stroke="#d03b3b" stroke-width="1.5" rx="4"/><rect width="116" height="21" x="572" y="200" fill="#fcfcfb" class="surf" rx="4"/><text x="630" y="215" fill="#d03b3b" class="deny" font-size="12.5" font-weight="700" text-anchor="middle">blocked · 4 h</text><rect width="106" height="40" x="740" y="190" fill="#f0efec" class="idle" rx="4"/><g stroke-linecap="round"><line x1="470" x2="470" y1="150" y2="186" stroke="#dcdbd6" stroke-dasharray="3 3" stroke-width="1.5" class="rule"/><line x1="524" x2="524" y1="150" y2="186" stroke="#dcdbd6" stroke-dasharray="3 3" stroke-width="1.5" class="rule"/></g><polygon fill="#0b0b0b" points="470 96 465 88 475 88" class="ink"/><text x="470" y="82" fill="#0b0b0b" class="ink" font-size="11.5" font-weight="600" text-anchor="middle">first message</text><line x1="90" x2="846" y1="248" y2="248" stroke="#dcdbd6" stroke-width="1" class="rule"/><g fill="#8a8985" class="ink3" font-size="11" text-anchor="middle"><text x="90" y="266">02:00</text><text x="252" y="266">05:00</text><text x="470" y="266">09:00</text><text x="524" y="266">10:00</text><text x="736" y="266">14:00</text></g><text x="90" y="290" fill="#52514e" class="ink2" font-size="12.5"><tspan font-weight="700">7 idle hours, then 4 more blocked.</tspan> The clock never ran while you were away.</text></svg>