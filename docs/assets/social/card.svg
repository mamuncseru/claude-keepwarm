<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" aria-labelledby="ct cd" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" viewBox="0 0 1200 630"><title id="ct">claude-keepwarm - keep Claude Code&apos;s 5-hour usage window rolling</title><desc id="cd">Without keepwarm, seven idle hours produce no usage window and you end up blocked for four hours. With keepwarm, windows tile continuously around the clock, so you are never blocked.</desc><defs><pattern id="deny" width="9" height="9" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="#d03b3b" fill-opacity=".18"/><line x1="0" x2="0" y1="0" y2="9" stroke="#d03b3b" stroke-width="3.4"/></pattern></defs><rect width="1200" height="630" x="0" y="0" fill="#fff"/><rect width="1200" height="7" x="0" y="0" fill="#256abf"/><circle cx="80" cy="72" r="7" fill="#1baf7a"/><text x="98" y="79" fill="#0b0b0b" font-size="21" font-weight="700">claude-keepwarm</text><text x="72" y="164" fill="#0b0b0b" font-size="47" font-weight="800" letter-spacing="-.9">Your 5-hour Claude Code window</text><text x="72" y="219" fill="#0b0b0b" font-size="47" font-weight="800" letter-spacing="-.9">only starts when <tspan fill="#256abf">you</tspan> do.</text><text x="72" y="263" fill="#52514e" font-size="22">Idle all night, and those hours buy you nothing.</text><text x="72" y="320" fill="#6f6e6a" font-size="15" font-weight="700" letter-spacing="1.1">WITHOUT</text><rect width="566" height="46" x="72" y="334" fill="#f0efec" rx="5"/><text x="355" y="363" fill="#52514e" font-size="18" text-anchor="middle">7 h idle - no window ever starts</text><rect width="79" height="46" x="641" y="334" fill="#256abf" rx="5"/><text x="680" y="363" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">1 h</text><rect width="324" height="46" x="723" y="334" fill="url(#deny)" rx="5"/><rect width="324" height="46" x="723" y="334" fill="none" stroke="#d03b3b" stroke-width="2" rx="5"/><rect width="158" height="24" x="806" y="345" fill="#fff" rx="5"/><text x="885" y="363" fill="#d03b3b" font-size="18" font-weight="700" text-anchor="middle">blocked 4 h</text><rect width="78" height="46" x="1050" y="334" fill="#f0efec" rx="5"/><text x="72" y="429" fill="#6f6e6a" font-size="15" font-weight="700" letter-spacing="1.1">WITH KEEPWARM</text><rect width="160" height="46" x="72" y="443" fill="#256abf" rx="5"/><rect width="403" height="46" x="235" y="443" fill="#256abf" rx="5"/><rect width="403" height="46" x="641" y="443" fill="#256abf" rx="5"/><rect width="81" height="46" x="1047" y="443" fill="#256abf" rx="5"/><text x="436" y="472" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">windows keep tiling</text><text x="842" y="472" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">you are never blocked</text><polygon fill="#1baf7a" points="235 500 228 512 242 512"/><polygon fill="#1baf7a" points="641 500 634 512 648 512"/><polygon fill="#1baf7a" points="1047 500 1040 512 1054 512"/><text x="256" y="511" fill="#52514e" font-size="15">a ~240-token ping opens each new window</text><line x1="72" x2="1128" y1="545" y2="545" stroke="#e6e4df" stroke-width="1"/><text x="72" y="581" fill="#0b0b0b" font-size="19"><tspan font-weight="700">No extra cost</tspan><tspan fill="#52514e"> - it uses the Claude subscription you already pay for.</tspan></text><text x="1128" y="581" fill="#6f6e6a" font-size="16" text-anchor="end">macOS · Linux · Windows · MIT</text><text x="72" y="606" fill="#256abf" font-size="16">github.com/mamuncseru/claude-keepwarm</text></svg>