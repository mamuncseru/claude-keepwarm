<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"
     role="img" aria-labelledby="ct cd"
     font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="ct">claude-keepwarm - keep Claude Code's 5-hour usage window rolling</title>
  <desc id="cd">Without keepwarm, seven idle hours produce no usage window and you end up blocked for four hours. With keepwarm, windows tile continuously around the clock, so you are never blocked.</desc>

  <defs>
    <pattern id="deny" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="9" height="9" fill="#d03b3b" fill-opacity="0.18"/>
      <line x1="0" y1="0" x2="0" y2="9" stroke="#d03b3b" stroke-width="3.4"/>
    </pattern>
  </defs>

  <!-- Fixed light surface: social platforms have no dark mode for uploads. -->
  <rect x="0" y="0" width="1200" height="630" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="7" fill="#256abf"/>

  <!-- ============================================================ header -->
  <circle cx="80" cy="72" r="7" fill="#1baf7a"/>
  <text x="98" y="79" font-size="21" font-weight="700" fill="#0b0b0b">claude-keepwarm</text>

  <!-- ========================================================== headline -->
  <text x="72" y="164" font-size="47" font-weight="800" fill="#0b0b0b" letter-spacing="-0.9">Your 5-hour Claude Code window</text>
  <text x="72" y="219" font-size="47" font-weight="800" fill="#0b0b0b" letter-spacing="-0.9">only starts when <tspan fill="#256abf">you</tspan> do.</text>

  <text x="72" y="263" font-size="22" fill="#52514e">Idle all night, and those hours buy you nothing.</text>

  <!-- ================================================= WITHOUT keepwarm -->
  <text x="72" y="320" font-size="15" font-weight="700" fill="#6f6e6a" letter-spacing="1.1">WITHOUT</text>

  <rect x="72"  y="334" width="566" height="46" rx="5" fill="#f0efec"/>
  <text x="355" y="363" font-size="18" text-anchor="middle" fill="#52514e">7 h idle - no window ever starts</text>

  <rect x="641" y="334" width="79"  height="46" rx="5" fill="#256abf"/>
  <text x="680" y="363" font-size="17" font-weight="700" text-anchor="middle" fill="#ffffff">1 h</text>

  <rect x="723" y="334" width="324" height="46" rx="5" fill="url(#deny)"/>
  <rect x="723" y="334" width="324" height="46" rx="5" fill="none" stroke="#d03b3b" stroke-width="2"/>
  <rect x="806" y="345" width="158" height="24" rx="5" fill="#ffffff"/>
  <text x="885" y="363" font-size="18" font-weight="700" text-anchor="middle" fill="#d03b3b">blocked 4 h</text>

  <rect x="1050" y="334" width="78" height="46" rx="5" fill="#f0efec"/>

  <!-- ==================================================== WITH keepwarm -->
  <text x="72" y="429" font-size="15" font-weight="700" fill="#6f6e6a" letter-spacing="1.1">WITH KEEPWARM</text>

  <rect x="72"  y="443" width="160" height="46" rx="5" fill="#256abf"/>
  <rect x="235" y="443" width="403" height="46" rx="5" fill="#256abf"/>
  <rect x="641" y="443" width="403" height="46" rx="5" fill="#256abf"/>
  <rect x="1047" y="443" width="81" height="46" rx="5" fill="#256abf"/>
  <text x="436" y="472" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">windows keep tiling</text>
  <text x="842" y="472" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">you are never blocked</text>

  <!-- ping markers at each boundary: distinct shape as well as colour -->
  <polygon points="235,500 228,512 242,512" fill="#1baf7a"/>
  <polygon points="641,500 634,512 648,512" fill="#1baf7a"/>
  <polygon points="1047,500 1040,512 1054,512" fill="#1baf7a"/>
  <text x="256" y="511" font-size="15" fill="#52514e">a ~240-token ping opens each new window</text>

  <!-- ============================================================ payoff -->
  <line x1="72" y1="545" x2="1128" y2="545" stroke="#e6e4df" stroke-width="1"/>
  <text x="72" y="581" font-size="19" fill="#0b0b0b">
    <tspan font-weight="700">No extra cost</tspan><tspan fill="#52514e"> - it uses the Claude subscription you already pay for.</tspan>
  </text>
  <text x="1128" y="581" font-size="16" text-anchor="end" fill="#6f6e6a">macOS · Linux · Windows · MIT</text>
  <text x="72" y="606" font-size="16" fill="#256abf">github.com/mamuncseru/claude-keepwarm</text>
</svg>
