<svg xmlns="http://www.w3.org/2000/svg" width="900" height="312" aria-labelledby="t2 d2" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" viewBox="0 0 900 312"><title id="t2">With keepwarm: windows tile back to back, so there is never a wait</title><desc id="d2">The same timeline from 02:00 to 15:00. keepwarm sends a tiny ping just after each window expires, opening windows at 04:00, 09:00 and 14:00 while you are away. Starting work at 08:30 uses the tail of the running window, then a fresh full-quota window opens at 09:00. Access is never blocked.</desc><style>.ink{fill:#0b0b0b}.ink2{fill:#52514e}.ink3{fill:#8a8985}.surf{fill:#fcfcfb}.onwin{fill:#fff}.rule{stroke:#dcdbd6}.idle{fill:#f0efec}.win{fill:#256abf}.ping{fill:#1baf7a}.pingS{stroke:#1baf7a}@media (prefers-color-scheme:dark){.ink{fill:#fff}.ink2{fill:#c3c2b7}.ink3{fill:#8f8e86}.surf{fill:#1a1a19}.rule{stroke:#4a4a46}.idle{fill:#383835}.win{fill:#3987e5}.onwin{fill:#0b0b0b}.ping{fill:#199e70}.pingS{stroke:#199e70}}</style><rect width="900" height="312" x="0" y="0" fill="#fcfcfb" class="surf"/><text x="34" y="36" fill="#0b0b0b" class="ink" font-size="16" font-weight="700">With keepwarm</text><text x="34" y="57" fill="#52514e" class="ink2" font-size="13">A tiny ping after each expiry keeps windows tiling — idle time burns them instead.</text><text x="34" y="98" fill="#8a8985" class="ink3" font-size="11" font-weight="600" letter-spacing=".6">USAGE WINDOW</text><rect width="106" height="40" x="90" y="106" fill="#256abf" class="win" rx="4"/><text x="143" y="131" fill="#fff" class="onwin" font-size="12" font-weight="600" text-anchor="middle">– 04:00</text><rect width="268" height="40" x="198" y="106" fill="#256abf" class="win" rx="4"/><text x="332" y="131" fill="#fff" class="onwin" font-size="12.5" font-weight="600" text-anchor="middle">window 04:00 – 09:00</text><rect width="266" height="40" x="470" y="106" fill="#256abf" class="win" rx="4"/><text x="603" y="131" fill="#fff" class="onwin" font-size="12.5" font-weight="600" text-anchor="middle">window 09:00 – 14:00</text><rect width="106" height="40" x="740" y="106" fill="#256abf" class="win" rx="4"/><text x="793" y="131" fill="#fff" class="onwin" font-size="12" font-weight="600" text-anchor="middle">14:00 –</text><g><polygon fill="#1baf7a" points="198 158 192 168 204 168" class="ping"/><polygon fill="#1baf7a" points="470 158 464 168 476 168" class="ping"/><polygon fill="#1baf7a" points="740 158 734 168 746 168" class="ping"/><line x1="198" x2="198" y1="150" y2="158" stroke="#1baf7a" stroke-width="2" class="pingS"/><line x1="470" x2="470" y1="150" y2="158" stroke="#1baf7a" stroke-width="2" class="pingS"/><line x1="740" x2="740" y1="150" y2="158" stroke="#1baf7a" stroke-width="2" class="pingS"/></g><text x="212" y="167" fill="#52514e" class="ink2" font-size="11.5">keepwarm ping <tspan fill="#8a8985" class="ink3">· ~240 tokens</tspan></text><text x="34" y="196" fill="#8a8985" class="ink3" font-size="11" font-weight="600" letter-spacing=".6">YOUR ACCESS</text><rect width="349" height="40" x="90" y="204" fill="#f0efec" class="idle" rx="4"/><text x="264" y="229" fill="#52514e" class="ink2" font-size="12.5" text-anchor="middle">away</text><rect width="403" height="40" x="443" y="204" fill="#256abf" class="win" rx="4"/><text x="644" y="229" fill="#fff" class="onwin" font-size="12.5" font-weight="700" text-anchor="middle">working — never blocked</text><line x1="443" x2="443" y1="172" y2="200" stroke="#dcdbd6" stroke-dasharray="3 3" stroke-width="1.5" class="rule"/><polygon fill="#0b0b0b" points="443 96 438 88 448 88" class="ink"/><text x="443" y="82" fill="#0b0b0b" class="ink" font-size="11.5" font-weight="600" text-anchor="middle">first message 08:30</text><line x1="470" x2="470" y1="248" y2="262" stroke="#dcdbd6" stroke-dasharray="3 3" stroke-width="1.5" class="rule"/><line x1="90" x2="846" y1="262" y2="262" stroke="#dcdbd6" stroke-width="1" class="rule"/><g fill="#8a8985" class="ink3" font-size="11" text-anchor="middle"><text x="90" y="280">02:00</text><text x="198" y="280">04:00</text><text x="470" y="280">09:00</text><text x="740" y="280">14:00</text></g><text x="90" y="302" fill="#52514e" class="ink2" font-size="12.5"><tspan font-weight="700">Same day, no wait.</tspan> You use the tail of the running window, then a full fresh one at 09:00.</text></svg>